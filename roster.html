<body>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="./"><img src="logos/hornet.png?v=2" alt=""><span>Wilson Memorial Wrestling</span></a>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </div>
  <nav class="tabs"><div class="inner"><a href="./">Home</a><a href="schedule.html">Schedule</a><a href="roster.html" class="on">Roster</a><a href="photos.html" id="navPhotos" hidden>Photos</a></div></nav>
</header>
<main id="main">

<article class="ros-card">
  <header class="ros-head">
    <div class="ros-logo"><img src="logos/hornet.png?v=2" alt=""></div>
    <div><small>Wilson Memorial Hornets</small><h1>Team Roster</h1><a href="./">&larr; Home</a></div>
  </header>
  <div id="list"><p class="empty">Loading…</p></div>
</article>

</main>
<footer class="footer" id="footer"></footer>
<script src="shared.js?v=15"></script>
<script>
const VERSION = "2.4";
setFooter(VERSION);

const GR = { "9": "FR", "10": "SO", "11": "JR", "12": "SR" };
// Short graduation year from grade, e.g. grade 10 in 2026-27 -> '29
const yr2 = g => g ? "\u2019" + String(Number(SITE.season.split("-")[0]) + 1 + (12 - Number(g))).slice(-2) : "";
loadAll().then(data => {
  const ws = data.roster.filter(w => !/^(n|no|false|0)$/i.test(w.active || ""))
    .sort((a, b) => (parseFloat(a.weight) - parseFloat(b.weight)) || a.last.localeCompare(b.last));
  const el = document.getElementById("list");
  if (!ws.length) { el.innerHTML = '<p class="empty">Roster coming soon.</p>'; return; }
  el.innerHTML = ws.map((w, i) => {
    const s = wrestlerStats(w.id, data.bouts);
    const rec = s.matches ? `${s.W}-${s.L}${s.F ? ` · ${s.F} pin${s.F > 1 ? "s" : ""}` : ""}` : "";
    return `<a class="ros-row" href="wrestler.html?id=${encodeURIComponent(w.id)}">
      <span class="ros-wt ${i % 2 ? "alt" : ""}">${esc(w.weight)}</span>
      <span class="ros-name"><b>${esc(fullName(w))}</b>${rec ? `<small>${esc(rec)}</small>` : ""}</span>
      <span class="ros-ic" title="Class of ${esc(String(Number(SITE.season.split("-")[0]) + 1 + (12 - Number(w.grade))))}">${esc(yr2(w.grade))}</span>
      <span class="ros-gr">${esc(GR[w.grade] || w.grade)}</span>
    </a>`;
  }).join("");
}).catch(e => showError(document.getElementById("list"), e));

</script>
</body>
</html>
